server:
  port: 8084
  error:
    include-message: always

spring:
  application:
    name: ms-barriodigital-mq-admin
  config:
    import: optional:file:.env[.properties]
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    # Solo kafka-admin crea topics. mq-admin no declara NewTopic.
    admin:
      auto-create: false
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    # Kafka caído no tumba el health: la auditoría es best-effort.
    kafka:
      enabled: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

barriodigital:
  security:
    # Token compartido con el BFF. Sin él, /api/mq/** responde 401.
    internal-token: ${INTERNAL_TOKEN:}
  mq:
    protected-names:
      - amq.direct
      - amq.fanout
      - amq.topic
      - amq.headers
      - amq.match
      - amq.rabbitmq.trace
    # amq. sigue bloqueado en el servicio. La API lo responde 400 antes de llegar aquí.
    protected-prefixes:
      - amq.
      - cmd.
      - q.cmd.
    management:
      url: ${RABBITMQ_MANAGEMENT_URL:http://127.0.0.1:15672}
      username: ${RABBITMQ_USER:guest}
      password: ${RABBITMQ_PASSWORD:guest}
      vhost: ${RABBITMQ_VHOST:/}
